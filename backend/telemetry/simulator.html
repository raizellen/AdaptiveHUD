<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>EVA Telemetry Simulator</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #0b0b0b;
    color: #eee;
    padding: 2rem;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 { font-size: 1.25rem; margin-bottom: 1.5rem; }
  .field { margin-bottom: 1.5rem; }
  label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.4rem;
    font-size: 0.9rem;
  }
  input[type="range"] { width: 100%; }
  .status { margin-top: 2rem; font-size: 0.85rem; color: #8f8; }

  .mission-section {
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid #333;
  }
  .mission-section h2 {
    font-size: 1rem;
    margin-bottom: 1rem;
  }
  .mission-section label {
    display: block;
    margin-bottom: 0.4rem;
  }
  .mission-section input[type="text"],
  .mission-section textarea {
    width: 100%;
    box-sizing: border-box;
    background: #1a1a1a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 0.5rem;
    font: inherit;
    font-size: 0.9rem;
  }
  .mission-section textarea { resize: vertical; min-height: 4.5rem; }
  .mission-section button {
    background: #1a1a1a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 0.6rem 1rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .mission-section button:hover { background: #262626; }
  .mission-status { margin-top: 0.75rem; font-size: 0.85rem; color: #8f8; }

  .anomaly-section {
    margin-top: 2.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid #333;
  }
  .anomaly-section h2 {
    font-size: 1rem;
    color: #ffd24d;
    margin-bottom: 0.5rem;
  }
  .anomaly-section p {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 1rem;
  }
  .anomaly-buttons {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .anomaly-buttons button {
    background: #1a1a1a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 0.6rem;
    font-size: 0.85rem;
    text-align: left;
    cursor: pointer;
  }
  .anomaly-buttons button:hover { background: #262626; }
  .anomaly-buttons button.reset {
    border-color: #4d8f4d;
    color: #9f9;
  }
  .anomaly-buttons button.reset:hover { background: #10200f; }
</style>
</head>
<body>
  <h1>EVA Telemetry Simulator</h1>

  <div class="mission-section">
    <h2>Mission details</h2>

    <div class="field">
      <label for="missionTitle">Title</label>
      <input type="text" id="missionTitle" maxlength="80" />
    </div>

    <div class="field">
      <label for="missionObjective">Objective</label>
      <textarea id="missionObjective" maxlength="300"></textarea>
    </div>

    <button onclick="updateMission()">Update mission</button>
    <div class="mission-status" id="missionStatus"></div>
  </div>

  <div class="field">
    <label>Heart rate (bpm) <span id="bpmVal">75</span></label>
    <input type="range" id="bpm" min="30" max="220" value="75" />
  </div>

  <div class="field">
    <label>SpO2 (%) <span id="spo2Val">98</span></label>
    <input type="range" id="spo2" min="70" max="100" value="98" />
  </div>

  <div class="field">
    <label>Battery (%) <span id="batteryVal">76</span></label>
    <input type="range" id="battery" min="0" max="100" value="76" />
  </div>

  <div class="field">
    <label>Temperature (&deg;C) <span id="temperatureVal">21</span></label>
    <input type="range" id="temperature" min="-20" max="60" value="21" />
  </div>

  <div class="status" id="status">Idle</div>

  <div class="anomaly-section">
    <h2>⚠ Anomaly Testing</h2>
    <p>
      The sliders above are already clamped to plausible values, so
      normal dragging won't trigger the Data Processing Layer. These
      buttons send values the sliders can't, straight to /telemetry,
      to test each anomaly type.
    </p>
    <div class="anomaly-buttons">
      <button onclick="testOutOfRange()">Out-of-range SpO2 (200%)</button>
      <button onclick="testInvalidType()">Invalid SpO2 (non-numeric)</button>
      <button onclick="testRateSpike()">SpO2 rate spike (drop 28 in one tick)</button>
      <button onclick="testNoSignal()">No finger on sensor (0 bpm, 0 SpO2)</button>
      <button class="reset" onclick="undoAnomaly()">↺ Reset to normal (clear anomaly)</button>
    </div>
  </div>

  <script>
    const fields = ["bpm", "spo2", "battery", "temperature"];

    function send() {
      const payload = {};
      fields.forEach((f) => {
        const el = document.getElementById(f);
        const val = parseFloat(el.value);
        payload[f] = val;
        document.getElementById(f + "Val").textContent = val;
      });
      return sendRaw(payload);
    }

    // Posts directly to /telemetry with whatever payload you give it,
    // bypassing the sliders' min/max/step entirely — that's what lets
    // these test buttons send values the UI itself would never produce.
    function sendRaw(payload) {
      return fetch("/telemetry", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      })
        .then((r) => r.json())
        .then((data) => {
          if (data.anomalies && data.anomalies.length > 0) {
            document.getElementById("status").textContent =
              `⚠ ${data.anomalies.length} anomaly(ies) flagged: ` +
              data.anomalies.map((a) => `${a.metric} (${a.type})`).join(", ");
          } else {
            document.getElementById("status").textContent =
              "Sent " + new Date().toLocaleTimeString() + " — no anomalies";
          }
          return data;
        })
        .catch(() => {
          document.getElementById("status").textContent =
            "Error sending telemetry — is backend/server.ts running?";
        });
    }

    fields.forEach((f) => {
      document.getElementById(f).addEventListener("input", send);
    });

    // --- Mission details ---

    function setMissionStatus(text) {
      document.getElementById("missionStatus").textContent = text;
    }

    function fillMissionFields(mission) {
      document.getElementById("missionTitle").value = mission.title;
      document.getElementById("missionObjective").value = mission.objective;
    }

    // Start from whatever the HUD is currently showing, so pressing
    // Update after editing only one field doesn't overwrite the other.
    fetch("/mission")
      .then((r) => r.json())
      .then((data) => {
        if (data.ok) fillMissionFields(data.mission);
      })
      .catch(() => {
        setMissionStatus(
          "Couldn't load mission — is backend/server.ts running?"
        );
      });

    function updateMission() {
      const payload = {
        title: document.getElementById("missionTitle").value,
        objective: document.getElementById("missionObjective").value,
      };

      return fetch("/mission", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      })
        .then((r) => r.json())
        .then((data) => {
          if (data.ok) {
            // Show the server's cleaned-up version (trimmed, length-capped).
            fillMissionFields(data.mission);
            setMissionStatus(
              "Mission updated " + new Date().toLocaleTimeString()
            );
          } else {
            setMissionStatus("Not updated: " + data.error);
          }
        })
        .catch(() => {
          setMissionStatus(
            "Error updating mission — is backend/server.ts running?"
          );
        });
    }

    // --- Anomaly test presets ---

    function testOutOfRange() {
      sendRaw({ spo2: 200 });
    }

    function testInvalidType() {
      sendRaw({ spo2: "out of range" });
    }

    async function testRateSpike() {
      // Establish a known baseline, then jump far past the processor's
      // MAX_DELTA for SpO2 (8) in a single reading.
      await sendRaw({ spo2: 98 });
      await sendRaw({ spo2: 60 });
    }

    async function testNoSignal() {
      // A pulse oximeter with no finger on it reports zeros. Both
      // values fall below the processor's plausible range, so they
      // are rejected and the last good readings stay on the HUD.
      await sendRaw({ bpm: 0, spo2: 0 });
    }

    // Restores a plausible baseline reading for every metric — this
    // clears any anomaly banner (an empty anomalies array is what
    // tells the HUD to hide it) AND re-syncs the sliders to match, so
    // dragging one afterward doesn't itself look like a rate spike
    // against whatever a test button last sent.
    function undoAnomaly() {
      const normal = { bpm: 75, spo2: 98, battery: 90, temperature: 21 };
      Object.keys(normal).forEach((f) => {
        const el = document.getElementById(f);
        if (el) {
          el.value = normal[f];
          document.getElementById(f + "Val").textContent = normal[f];
        }
      });
      return sendRaw(normal);
    }
  </script>
</body>
</html>
