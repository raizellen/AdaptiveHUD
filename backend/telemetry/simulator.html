<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>EVA Telemetry Simulator</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #0b0b0b;
    color: #eee;
    padding: 2rem;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 { font-size: 1.25rem; margin-bottom: 1.5rem; }
  .field { margin-bottom: 1.5rem; }
  label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.4rem;
    font-size: 0.9rem;
  }
  input[type="range"] { width: 100%; }
  .status { margin-top: 2rem; font-size: 0.85rem; color: #8f8; }
</style>
</head>
<body>
  <h1>EVA Telemetry Simulator</h1>

  <div class="field">
    <label>Oxygen (%) <span id="oxygenVal">92</span></label>
    <input type="range" id="oxygen" min="0" max="100" value="92" />
  </div>

  <div class="field">
    <label>CO2 (%) <span id="co2Val">0.8</span></label>
    <input type="range" id="co2" min="0" max="5" step="0.1" value="0.8" />
  </div>

  <div class="field">
    <label>Battery (%) <span id="batteryVal">76</span></label>
    <input type="range" id="battery" min="0" max="100" value="76" />
  </div>

  <div class="field">
    <label>Temperature (&deg;C) <span id="temperatureVal">21</span></label>
    <input type="range" id="temperature" min="-20" max="60" value="21" />
  </div>

  <div class="status" id="status">Idle</div>

  <script>
    const fields = ["oxygen", "co2", "battery", "temperature"];

    function send() {
      const payload = {};
      fields.forEach((f) => {
        const el = document.getElementById(f);
        const val = parseFloat(el.value);
        payload[f] = val;
        document.getElementById(f + "Val").textContent = val;
      });

      fetch("/telemetry", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      })
        .then((r) => r.json())
        .then(() => {
          document.getElementById("status").textContent =
            "Sent " + new Date().toLocaleTimeString();
        })
        .catch(() => {
          document.getElementById("status").textContent =
            "Error sending telemetry";
        });
    }

    fields.forEach((f) => {
      document.getElementById(f).addEventListener("input", send);
    });
  </script>
</body>
</html>
