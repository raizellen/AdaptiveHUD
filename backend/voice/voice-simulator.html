<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>EVA Voice Simulator</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #0b0b0b;
    color: #eee;
    padding: 2rem;
    max-width: 480px;
    margin: 0 auto;
    text-align: center;
  }
  h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
  p { color: #999; font-size: 0.85rem; margin-bottom: 1.5rem; }
  button {
    font-size: 1rem;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    border: none;
    background: #1a3a8a;
    color: #fff;
    cursor: pointer;
  }
  button.listening { background: #1a8a3a; }
  button:disabled { background: #333; cursor: not-allowed; }
  .transcript {
    margin-top: 1.5rem;
    font-style: italic;
    color: #aaa;
    min-height: 1.5em;
  }
  .log {
    margin-top: 1.5rem;
    text-align: left;
    font-size: 0.85rem;
    color: #8fd;
    max-height: 220px;
    overflow-y: auto;
    border-top: 1px solid #333;
    padding-top: 1rem;
  }
  .log div { margin-bottom: 0.4rem; }
  .warning { color: #ffd24d; margin-top: 1rem; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>EVA Voice Simulator</h1>
  <p>
    Uses your laptop's default microphone (built-in, or a Bluetooth mic
    set as default in Windows Sound settings) via your browser's speech
    recognition. Works best in Chrome or Edge.
  </p>

  <button id="toggleBtn">Start Listening</button>

  <div class="transcript" id="transcript"></div>
  <div class="warning" id="warning"></div>
  <div class="log" id="log"></div>

  <script>
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    const toggleBtn = document.getElementById("toggleBtn");
    const transcriptEl = document.getElementById("transcript");
    const logEl = document.getElementById("log");
    const warningEl = document.getElementById("warning");

    if (!SpeechRecognition) {
      warningEl.textContent =
        "Your browser doesn't support speech recognition. Try Chrome or Edge.";
      toggleBtn.disabled = true;
    }

    let recognition = null;
    let listening = false;

    function log(text, parsedType) {
      const entry = document.createElement("div");
      entry.textContent = `"${text}" -> ${parsedType}`;
      logEl.prepend(entry);
    }

    function sendTranscript(text) {
      fetch("/voice-transcript", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      })
        .then((r) => r.json())
        .then((data) => {
          log(text, data.command ? data.command.type : "ERROR");
        })
        .catch(() => log(text, "SEND FAILED"));
    }

    function startRecognition() {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "en-US";

      recognition.onresult = (event) => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          if (result.isFinal) {
            sendTranscript(result[0].transcript.trim());
          } else {
            interim += result[0].transcript;
          }
        }
        transcriptEl.textContent = interim;
      };

      recognition.onerror = (event) => {
        warningEl.textContent = "Recognition error: " + event.error;
      };

      recognition.onend = () => {
        // The browser stops the session periodically on its own;
        // restart automatically if we're still meant to be listening.
        if (listening) recognition.start();
      };

      recognition.start();
    }

    toggleBtn.addEventListener("click", () => {
      listening = !listening;

      if (listening) {
        toggleBtn.textContent = "Stop Listening";
        toggleBtn.classList.add("listening");
        warningEl.textContent = "";
        startRecognition();
      } else {
        toggleBtn.textContent = "Start Listening";
        toggleBtn.classList.remove("listening");
        if (recognition) recognition.stop();
      }
    });
  </script>
</body>
</html>
